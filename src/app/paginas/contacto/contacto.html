<header class="navbar">
  <div class="nav-logo">
    <span class="logo-badge"><img src="fotos/logo.jpeg" alt="TrueForm"></span>
    TrueForm
  </div>
  <button type="button" class="nav-toggle" aria-label="Abrir menu" (click)="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
  <nav class="nav-links" id="navLinks" [class.open]="menuAbierto">
    <a routerLink="/">Inicio</a>
    <a routerLink="/nosotros">Sobre Nosotros</a>
    <a routerLink="/beneficios">Beneficios</a>
    <a routerLink="/contacto" class="active">Contacto</a>
    <a routerLink="/login" class="btn-login">Iniciar Sesión</a>
    <a routerLink="/registro" class="btn-register">Registrar</a>
  </nav>
</header>

<main class="teal-page">
  <div class="panel panel-split">

    <div class="contact-info">
      <div class="ci-item">
        <i class="fa-solid fa-location-dot"></i>
        <p>Av. Nicolás Dueñas 325</p>
      </div>
      <div class="ci-item">
        <i class="fa-solid fa-phone-volume"></i>
        <p>+51 954 425 954</p>
      </div>
      <div class="ci-item">
        <i class="fa-solid fa-envelope"></i>
        <p>support&#64;trueform.com</p>
      </div>
      <div class="ci-item">
        <i class="fa-brands fa-whatsapp"></i>
        <p>+51 954 245 134</p>
      </div>
    </div>

    <form (submit)="enviarContacto($event)">
      <h2 style="text-align:center">Contáctanos</h2>
      <div class="field">
        <label for="cEmail">Email</label>
        <input class="line-input" type="email" id="cEmail" name="email" required>
      </div>
      <div class="field">
        <label for="cAsunto">Asunto</label>
        <input class="line-input" type="text" id="cAsunto" name="asunto" required>
      </div>
      <div class="field">
        <label for="cDesc">Descripción</label>
        <textarea class="line-textarea" id="cDesc" name="descripcion" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar</button>
    </form>

  </div>
</main>

<footer class="footer">© 2026 TrueForm — Tu entrenador inteligente.</footer>
